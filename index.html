<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League Auction</title>
<meta name="theme-color" content="#071A24">
<meta name="description" content="Player registration, team logins and live auction for your league.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<style>
/* ========== Tokens ========== */
:root{
  --gold:#FFC629;--teal:#19C9B5;--bg:#071A24;--red:#FF4B3E;--green:#35D07F;
  --panel:color-mix(in srgb,var(--bg) 86%,#7fd4e0 14%);
  --panel-2:color-mix(in srgb,var(--bg) 76%,#7fd4e0 24%);
  --line:color-mix(in srgb,var(--bg) 66%,#9fe0e8 34%);
  --ink:#F3F8F6;--ink-2:#A9C6CA;--ink-3:#7E9EA4;--on-gold:#14110A;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --slant:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2.4rem,7vw,4.6rem)}h2{font-size:1.9rem}h3{font-size:1.3rem}
p{margin:0}a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:800}
.muted{color:var(--ink-2)}.small{font-size:.875rem}.hide{display:none!important}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.stack{display:grid;gap:1rem}.grow{flex:1 1 auto;min-width:0}

/* ========== Controls ========== */
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);padding:.6rem 1rem;border-radius:6px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#04191b}
.btn.danger{background:var(--red);border-color:var(--red);color:#1b0503}
.btn.good{background:var(--green);border-color:var(--green);color:#03180c}
.btn.ghost{background:transparent}
.btn.sm{padding:.25rem .6rem;min-height:34px;font-size:.875rem}
label.f{display:grid;gap:.3rem;font-size:.875rem;font-weight:600;color:var(--ink-2)}
label.f small{font-weight:400;color:var(--ink-3)}
input:not([type=checkbox]):not([type=color]):not([type=range]):not([type=file]),select,textarea{width:100%;background:color-mix(in srgb,var(--bg) 70%,#000 30%);border:1px solid var(--line);border-radius:6px;padding:.6rem .7rem;min-height:44px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input[type=color]{width:100%;height:44px;padding:2px;background:transparent;border:1px solid var(--line);border-radius:6px}
select option{background:#0c2531}
.check{display:flex;gap:.6rem;align-items:center;font-weight:500;color:var(--ink);min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--teal)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.1rem}
.panel>h3{margin-bottom:.75rem}
.tag{display:inline-block;padding:.05rem .5rem;border-radius:4px;font-size:.78rem;font-weight:600;background:var(--panel-2);white-space:nowrap}
.tag.pending,.tag.skipped,.tag.paused{background:#5a4608;color:#FFE08A}.tag.approved,.tag.queued{background:#0b4a44;color:#8FF2E5}
.tag.rejected,.tag.unsold{background:#5b1a15;color:#FFB0A9}.tag.withdrawn{background:#2b3d44;color:#B6CACE}
.tag.sold,.tag.live{background:#0d4a2b;color:#96F0BF}.tag.active{background:var(--gold);color:var(--on-gold)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:.82rem;padding:.65rem .8rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .8rem;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr:hover{background:color-mix(in srgb,var(--panel-2) 55%,transparent)}
td.r,th.r{text-align:right}.empty{padding:2rem 1rem;text-align:center;color:var(--ink-2)}
.av{width:42px;height:42px;border-radius:6px;object-fit:cover;background:var(--panel-2);display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--ink-2);flex:none;overflow:hidden}
.av.lg{width:72px;height:72px;font-size:1.6rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.stat{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:6px;padding:.75rem 1rem}
.stat b{display:block;font-family:var(--display);font-size:2.3rem;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--ink-2)}
.bar-row{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto;align-items:center;gap:.7rem;padding:.3rem 0;font-size:.9rem}
.bar-track{height:12px;display:flex;align-items:center}.bar{height:12px;border-radius:0 4px 4px 0;background:var(--teal);min-width:2px}
.bar-row:hover .bar{filter:brightness(1.2)}

/* ========== Banners, toasts, modal ========== */
#conn{position:fixed;left:0;right:0;top:0;z-index:80;background:var(--red);color:#190302;font-weight:700;text-align:center;padding:.5rem 1rem;display:none}
#conn.on{display:block}#conn.warn{background:var(--gold);color:var(--on-gold)}
#toasts{position:fixed;right:16px;bottom:16px;left:16px;z-index:90;display:grid;gap:.5rem;justify-items:end;pointer-events:none}
.toast{background:#102e3a;border:1px solid var(--line);border-left:5px solid var(--teal);padding:.7rem 1rem;border-radius:6px;max-width:440px;box-shadow:0 8px 30px #0008;animation:toast .18s ease-out}
.toast.err{border-left-color:var(--red)}@keyframes toast{from{transform:translateY(8px);opacity:0}}
.modal-bg{position:fixed;inset:0;background:#02090dd0;z-index:70;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);padding:1.4rem;display:grid;gap:1rem;max-height:calc(100dvh - 32px);overflow:auto}
.modal.wide{width:min(900px,100%)}

/* ========== Public pages ========== */
.page{max-width:980px;margin:0 auto;padding:1.25rem 16px 3rem}
.topline{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:.6rem;align-items:center;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.3rem;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand img,.brand .av{width:36px;height:36px;border-radius:6px;object-fit:contain}
.hero{padding:2.2rem 0 2rem;position:relative}
.hero .state{display:inline-block;background:var(--gold);color:var(--on-gold);font-family:var(--display);font-weight:800;font-size:1.25rem;padding:.2rem 1.4rem;clip-path:var(--slant);margin-bottom:1rem}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-top:1.5rem}
.door{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:8px;padding:1.2rem}
.door:hover{background:var(--panel-2)}.door h2{margin-bottom:.35rem}.door p{color:var(--ink-2)}
.authbox{max-width:430px;margin:3rem auto 0}
.photo-pick{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.photo-prev{width:112px;height:112px;border-radius:8px;object-fit:cover;background:var(--panel-2);border:1px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:.8rem;text-align:center}
.crop-wrap{position:relative;width:min(360px,100%);aspect-ratio:1;margin:0 auto;touch-action:none;cursor:grab;border-radius:8px;overflow:hidden;background:#000}
.crop-wrap canvas{width:100%;height:100%;display:block}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.9rem}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pcard .ph{aspect-ratio:1;background:var(--panel-2);display:grid;place-items:center;font-family:var(--display);font-size:3rem;color:var(--ink-3);overflow:hidden}
.pcard img{width:100%;height:100%;object-fit:cover;display:block}.pcard .b{padding:.7rem .8rem;display:grid;gap:.25rem}

/* ========== Admin shell ========== */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
.side{background:color-mix(in srgb,var(--bg) 92%,#000 8%);border-right:1px solid var(--line);padding:1rem .6rem;position:sticky;top:0;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:.15rem}
.side .brand{padding:0 .5rem 1rem}
.side a.nav{display:flex;justify-content:space-between;padding:.48rem .7rem;border-radius:5px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.94rem}
.side a.nav:hover{background:var(--panel);color:var(--ink)}
.side a.nav.on{background:var(--gold);color:var(--on-gold);font-weight:700}
.side .grp{font-size:.78rem;color:var(--ink-3);padding:.8rem .7rem .2rem}
.main{min-width:0;display:flex;flex-direction:column}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1.2rem;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
.content{padding:1.2rem;display:grid;gap:1.1rem;min-width:0}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center;padding:.5rem;border-right:0;border-bottom:1px solid var(--line)}.side .grp{display:none}.side .brand{padding:0 .5rem 0 0;flex:none}.side a.nav{white-space:nowrap;flex:none}.bar-top{position:static}}

/* ========== Control room ========== */
.room{display:grid;grid-template-columns:minmax(230px,300px) minmax(320px,1fr) minmax(250px,320px);gap:1rem;align-items:start}
@media(max-width:1180px){.room{grid-template-columns:1fr}}
.lot-list{max-height:560px;overflow:auto;display:grid;gap:.25rem;margin-top:.6rem}
.lot{display:flex;gap:.55rem;align-items:center;padding:.35rem .4rem;border-radius:5px;background:transparent;border:0;text-align:left;cursor:pointer;width:100%}
.lot:hover:not(:disabled){background:var(--panel-2)}.lot:disabled{cursor:default;opacity:.55}
.block-now{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center}
.block-now .bid{font-family:var(--display);font-weight:900;font-size:4rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.phase-strip{display:flex;gap:2px;margin:.9rem 0;flex-wrap:wrap}
.phase-strip span{flex:1 1 90px;text-align:center;padding:.3rem .2rem;background:var(--panel-2);font-size:.78rem;color:var(--ink-3);font-weight:600}
.phase-strip span.on{background:var(--gold);color:var(--on-gold)}.phase-strip span.past{color:var(--ink-2)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.5rem}
.ctl .btn{min-height:54px;font-size:1rem}
.feed{display:grid;gap:.1rem;max-height:430px;overflow:auto;font-size:.87rem}
.feed div{display:flex;justify-content:space-between;gap:.6rem;padding:.3rem .4rem;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
.feed .rej{color:#FFB0A9}.feed .ok b{color:var(--gold)}

/* ========== Team page ========== */
.team-head h1{font-size:clamp(1.8rem,6vw,2.6rem)}.team-head{display:flex;gap:1rem;align-items:center;padding:.7rem 1rem;border-radius:8px;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--tc,var(--gold))}
.bidbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.1rem;display:grid;gap:1rem}
.bidbox.lc{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.bidgrid{display:grid;grid-template-columns:96px 1fr;gap:1rem;align-items:center}
.bidgrid .ph{width:96px;height:96px;border-radius:8px;object-fit:cover;background:var(--panel-2);display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;color:var(--ink-3)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.6rem}
.figs div span{display:block;font-size:.8rem;color:var(--ink-2)}.figs div b{font-family:var(--display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.bigbid{width:100%;min-height:92px;border:0;border-radius:8px;background:var(--gold);color:var(--on-gold);font-family:var(--display);font-weight:900;font-size:2.6rem;cursor:pointer;transition:transform .08s}
.bigbid:active:not(:disabled){transform:scale(.98)}
.bigbid:disabled{background:var(--panel-2);color:var(--ink-2);font-size:1.5rem;cursor:not-allowed;font-weight:700}

/* ========== Projector ========== */
.pj-root{position:fixed;inset:0;background:#000;overflow:hidden;cursor:none}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden;font-family:var(--body);color:var(--ink)}
.stage::before{content:"";position:absolute;inset:0;background:
  linear-gradient(112deg,transparent 0 22%,color-mix(in srgb,var(--teal) 7%,transparent) 22% 23%,transparent 23% 74%,color-mix(in srgb,var(--gold) 6%,transparent) 74% 76%,transparent 76%),
  radial-gradient(1200px 500px at 50% -80px,color-mix(in srgb,var(--teal) 20%,transparent),transparent 72%)}
.scene{position:absolute;inset:0 0 96px 0}
.statsbar{position:absolute;left:0;right:0;bottom:0;height:96px;background:color-mix(in srgb,var(--bg) 70%,#000 30%);border-top:3px solid var(--gold);display:grid;grid-template-columns:repeat(5,1fr) 1.6fr;align-items:center;z-index:30}
.statsbar .s{padding:0 30px;border-right:1px solid var(--line);display:flex;align-items:baseline;gap:14px;white-space:nowrap}
.statsbar b{font-family:var(--display);font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.statsbar span{font-size:21px;color:var(--ink-2);font-weight:500}
.statsbar .prog{padding:0 34px;display:grid;gap:8px}.prog .t{display:flex;justify-content:space-between;align-items:baseline}
.prog .tr{height:12px;background:var(--panel-2);border-radius:0 4px 4px 0}.prog .fi{height:100%;background:var(--gold);border-radius:0 4px 4px 0;transition:width .8s}
.pj-top{position:absolute;left:0;right:0;top:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;z-index:5}
.pj-brand{display:flex;gap:16px;align-items:center;font-family:var(--display);font-size:38px;font-weight:800}
.pj-brand img,.pj-brand .av{width:60px;height:60px;object-fit:contain;border-radius:8px}
.pill{font-family:var(--display);font-weight:800;font-size:36px;padding:4px 40px;background:var(--panel-2);clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.pill.open{background:var(--teal);color:#04191b}.pill.lc{background:var(--red);color:#fff}.pill.closed{background:var(--gold);color:var(--on-gold)}
.pj-live{position:absolute;inset:92px 44px 24px;display:grid;grid-template-columns:340px 1fr 400px;gap:32px}
.pj-live .col{display:flex;flex-direction:column;gap:20px;min-height:0}
.card{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:26px 28px}
.lab{font-size:24px;color:var(--ink-2);font-weight:500}
.val{font-family:var(--display);font-size:60px;font-weight:800;line-height:1.05}
.val.sm{font-size:46px}
.center{display:grid;grid-template-rows:auto 1fr;gap:12px;text-align:center;min-height:0}
.bidnum{font-family:var(--display);font-weight:900;font-size:262px;line-height:.92;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.bidnum small{font-size:64px;font-weight:800;margin-left:14px;color:var(--ink)}
.bidlab{font-size:32px;color:var(--ink-2);font-weight:600}
.bump{animation:bump .5s cubic-bezier(.2,.9,.3,1)}
@keyframes bump{0%{transform:scale(.9)}45%{transform:scale(1.07);text-shadow:0 0 44px color-mix(in srgb,var(--gold) 70%,transparent)}100%{transform:scale(1)}}
.center-low{display:grid;grid-template-columns:300px 1fr 210px;gap:28px;align-items:center;text-align:left;min-height:0}
.pj-photo{width:300px;height:400px;object-fit:cover;object-position:top;border-radius:10px;border:4px solid var(--line);background:var(--panel-2);display:grid;place-items:center;font-family:var(--display);font-size:130px;color:var(--ink-3)}
.pj-name{font-family:var(--display);font-size:78px;font-weight:900;line-height:1;overflow-wrap:break-word}.pj-name.long{font-size:62px}
.pj-pos{font-size:36px;color:var(--ink-2);font-weight:600;margin-top:12px}
.ring{position:relative;width:210px;height:210px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:14}
.ring .tr{stroke:var(--panel-2)}.ring .fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .2s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:96px;font-weight:900;font-variant-numeric:tabular-nums}
.ring.urgent .fg{stroke:var(--red)}.ring.urgent b{color:var(--red)}
.ring small{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-size:22px;color:var(--ink-2)}
.lead-logo{width:190px;height:190px;object-fit:contain;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-family:var(--display);font-size:80px;font-weight:900;margin-bottom:14px}
.lead{border-left:10px solid var(--lc,var(--line))}.lead.swap{animation:swap .45s cubic-bezier(.2,.9,.3,1)}
@keyframes swap{from{transform:translateX(60px);opacity:0}}
.act{display:flex;justify-content:space-between;font-size:30px;padding:9px 0;border-bottom:1px solid var(--line);gap:14px}
.act b{font-family:var(--display);font-size:38px;font-variant-numeric:tabular-nums;line-height:1.1}.act span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.act:first-child{color:var(--gold)}
/* last call */
.stage.lastcall .frame{position:absolute;inset:0;border:14px solid var(--red);z-index:20;pointer-events:none;animation:frame 1s ease-in-out infinite alternate}
@keyframes frame{from{opacity:.45}to{opacity:1}}
.lc-banner{position:absolute;left:0;right:0;top:0;height:92px;background:var(--red);color:#fff;z-index:12;text-align:center;font-family:var(--display);font-size:78px;font-weight:900;line-height:92px;letter-spacing:.06em;animation:drop .35s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{transform:translateY(-100%)}}
.pause-veil{position:absolute;inset:0 0 96px 0;background:#020a0ee0;z-index:25;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:170px;color:var(--gold)}
/* intro */
.intro{position:absolute;inset:0;--u:1s;overflow:hidden;background:#020B10;animation:fadein calc(var(--u)*.4) both}
@keyframes fadein{from{opacity:0}}
.intro>*{position:absolute}
.i-logo{left:50%;top:50%;width:300px;height:300px;margin:-190px 0 0 -150px;display:grid;place-items:center;font-family:var(--display);font-size:90px;font-weight:900;text-align:center;line-height:1;animation:logo calc(var(--u)*1.25) both calc(var(--u)*.2)}
.i-logo img{width:100%;height:100%;object-fit:contain}
@keyframes logo{0%{opacity:0;transform:scale(.5) rotate(-6deg)}35%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.3)}}

/* ========== 2. Utilities ========== */
const $ = (s, r = document) => r.querySelector(s);

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

// Runs an action, reports failure, and keeps the triggering button disabled while it is in flight.

}

const mediaUrl = p => p ? `${CONFIG.SUPABASE_URL}/storage/v1/object/public/${CONFIG.BUCKET}/${String(p).split('/').map(encodeURIComponent).join('/')}` : '';

/* ========== 3. Modals ========== */
function openModal(content, { wide = false, onClose } = {}) {

  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); onClose?.(); };

function confirmDialog({ title, body = '', confirmLabel = 'Confirm', tone = 'primary', input = null }) {

const formData = f => Object.fromEntries(new FormData(f).entries());

/* ========== 4. Image crop and upload ========== */
function cropImage(file, { out = 800, type = 'image/jpeg' } = {}) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('Choose an image file.'));
    const img = new Image();
    img.onerror = () => reject(new Error('This image could not be opened. Try a JPG or PNG.'));
    img.onload = () => {
      let done = false;
      const m = openModal(html`<h2>Crop the photo</h2><p class="muted small">Drag to position. Use the slider to zoom.</p>
        <div class="crop-wrap"><canvas width="720" height="720"></canvas></div>
        <label class="f">Zoom<input type="range" id="cz" min="1" max="4" step="0.01" value="1"></label>
        <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="cu">Use photo</button></div>`,
        { onClose: () => { URL.revokeObjectURL(img.src); if (!done) resolve(null); } });
      const c = $('canvas', m.el), ctx = c.getContext('2d'), base = Math.max(720 / img.naturalWidth, 720 / img.naturalHeight);
      let z = 1, x = 0, y = 0;
      const draw = () => {
        const s = base * z, w = img.naturalWidth * s, h = img.naturalHeight * s;
        x = Math.min(0, Math.max(720 - w, x)); y = Math.min(0, Math.max(720 - h, y));
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 720, 720); ctx.drawImage(img, x, y, w, h);
      };
      x = (720 - img.naturalWidth * base) / 2; y = (720 - img.naturalHeight * base) / 2; draw();
      $('#cz', m.el).oninput = e => {
        const nz = +e.target.value, k = nz / z; x = 360 - (360 - x) * k; y = 360 - (360 - y) * k; z = nz; draw();
      };
      let drag = null;
      c.onpointerdown = e => { drag = [e.clientX, e.clientY]; c.setPointerCapture(e.pointerId); };
      c.onpointermove = e => {
        if (!drag) return; const k = 720 / c.clientWidth;
        x += (e.clientX - drag[0]) * k; y += (e.clientY - drag[1]) * k; drag = [e.clientX, e.clientY]; draw();
      };
      c.onpointerup = () => drag = null;
      $('#cu', m.el).onclick = () => {
        const o = document.createElement('canvas'); o.width = o.height = out;
        const k = out / 720, s = base * z * k, g = o.getContext('2d');
        if (type === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, out, out); }

}

/* ========== 5. CSV ========== */
function toCsv(rows, cols) {

}
function download(name, text) {

  a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function parseCsv(t) {
  const rows = []; let row = [], cur = '', q = false; t = t.replace(/^﻿/, '');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x.trim())) rows.push(row); row = []; }

/* ========== 6. Live auction state ==========
   The server is the only source of truth. Realtime announces a new session version and the

const Live = {
  state: null, version: 0, offset: 0, lastOk: 0, rtOk: false, subs: new Set(), started: false, channel: null, failed: false,

  now() { return Date.now() + this.offset; },
  connected() { return navigator.onLine && Date.now() - this.lastOk < 12000 && !this.failed; },
  async refresh() {
    try {
      const t0 = Date.now();
      const { data, error } = await sb.rpc('get_auction_state');
      if (error) throw error;
      this.lastOk = Date.now(); this.failed = false;
      if (!data) { this.noTournament = true; this.notify(false); return; }
      this.noTournament = false;
      this.offset = new Date(data.server_now).getTime() - (t0 + (Date.now() - t0) / 2);
      if (data.session.version < this.version) return;
      const changed = data.session.version !== this.version;
      this.version = data.session.version; this.state = data;

  notify(changed) { this.banner(); if (this.state) this.subs.forEach(f => f(this.state, changed)); else this.subs.forEach(f => f(null, changed)); },
  listen(tid) {

      p => { if (!p.new || p.new.version > this.version) this.refresh(); });

    ch.subscribe(st => {
      if (st === 'SUBSCRIBED') { this.rtOk = true; this.banner(); this.refresh(); }

const PHASE_LABEL = { idle: 'Waiting for next player', introduction: 'Player introduction', bidding: 'Bidding open', last_call: 'Last call', closed: 'Bidding closed', sold: 'Sold', unsold: 'Unsold' };

  if (s.session.status === 'paused') return 'Paused';
  if (s.session.status === 'ended') return 'Auction ended';
  if (s.session.status === 'not_started') return 'Not started';
  if (s.session.phase === 'bidding' && s.current?.bid_count) return 'Live bidding';
  return PHASE_LABEL[s.session.phase];
}

const Theme = {

/* ========== 7. Sign-in ========== */

const Session = {

};
const Auth = {

    if (!Session.get()) { this.ctx = null; this.ready = true; return null; }

  async signOut() { try { await rpc('logout'); } catch { } Session.set(null); this.ctx = null; location.hash = '#/login'; },
  home() { return this.ctx?.role === 'admin' ? '#/admin/dashboard' : this.ctx?.team_id ? '#/team' : '#/login'; },

const Sound = {

  ready() { return this.ctx?.state === 'running'; },
  tone(f, t = 0, d = .18, g = .16, type = 'triangle') {

  lastCall() { [660, 660, 880].forEach((f, i) => this.tone(f, i * .22, .2, .22, 'square')); },
  sold() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * .11, .4, .2)); },
  unsold() { [392, 311].forEach((f, i) => this.tone(f, i * .2, .4, .18)); },

  const m = openModal(html`<h2>${t ? 'Edit ' + t.name : 'Add a team'}</h2><form class="stack" id="tf"><div id="tp">${pickerHtml(t?.logo_path, 'No logo')}</div><div class="fgrid">
    <label class="f">Team name<input name="name" required value="${t?.name || ''}"></label><label class="f">Short name <small>Up to 6 letters</small><input name="short_name" maxlength="6" value="${t?.short_name || ''}"></label>
    <label class="f">Team colour<input type="color" name="color" value="${t?.color || '#FFC629'}"></label>
    <label class="f">Starting budget<input name="starting_budget" type="number" min="0" value="${t?.starting_budget ?? st.default_budget}"></label><label class="f">Squad limit<input name="squad_limit" type="number" min="1" value="${t?.squad_limit ?? st.default_squad_limit}"></label></div>
    <label class="check"><input type="checkbox" name="is_active" ${!t || t.is_active ? 'checked' : ''}>Team takes part in the auction</label>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save team</button></div></form>`.s);
  const get = photoPicker($('#tp', m.el), { type: 'image/png', out: 512 });
  $('#tf', m.el).onsubmit = e => {
    e.preventDefault(); const d = formData(e.target); d.is_active = !!d.is_active; if (t) d.id = t.id;
    act(async () => { const b = get(); if (b) d.logo_path = await uploadImage(b, 'teams'); await rpc('admin_save_team', { p: d }); m.close(); toast('Team saved.'); await Live.refresh(); done?.(); }, $('button.primary', m.el));
  };
}
adminViews.teams = async (c) => {

  $('#ai').onclick = e => act(async () => { const n = await rpc('admin_apply_lot_defaults', { p_increment: Number($('[name=default_increment]').value) }); toast(`Increment applied to ${n} players.`); await load(); }, e.target);

/* ---------- Live control room ---------- */
adminViews.live = async (c) => {
  await whenState();
  let lots = [], events = [], lastV = -1, busy = false;
  c.innerHTML = html`<div class="room"><div class="panel"><h3>Player queue</h3><input id="lq" placeholder="Search players"><div class="lot-list" id="ll"></div></div>
    <div class="stack"><div class="panel" id="now"></div><div class="panel"><h3>Controls</h3><div class="ctl" id="ctl"></div></div><div class="panel"><div class="row between"><h3 style="margin:0">Enter a bid for a team</h3><small class="muted">For a team without a working device</small></div><div class="row" style="margin-top:.6rem" id="ab"></div></div></div>
    <div class="stack"><div class="panel"><h3>Incoming bids</h3><div class="feed" id="feed"></div></div><div class="panel"><h3>Team points</h3><div id="tp"></div></div></div></div>`.s;
  const run = (fn, args, ok) => act(async () => { if (busy) return; busy = true; try { await rpc(fn, args); if (ok) toast(ok); await Live.refresh(); } finally { busy = false; } });
  const loadSide = debounce(async () => {
    try { [lots, events] = await Promise.all([rpc('admin_list', { p_kind: 'lots' }), rpc('admin_list', { p_kind: 'events', p_limit: 60 })]); paintSide(); } catch { }
  }, 120);
  const paintSide = () => {
    if (!c.isConnected) return; const s = Live.state, can = s.session.status === 'live' && ['idle', 'sold', 'unsold'].includes(s.session.phase), q = $('#lq').value.toLowerCase();
    const list = lots.filter(l => ['queued', 'skipped'].includes(l.status) && (!q || (l.full_name + l.code).toLowerCase().includes(q)));
    $('#ll').innerHTML = list.map(l => html`<button class="lot" data-p="${l.auction_player_id}" ${can ? '' : 'disabled'}>${thumb(l.photo_path, l.full_name)}<span class="grow"><b>${l.full_name}</b><br><span class="small muted">${l.code}, ${l.primary_position}, base ${fmt(l.base_price)}</span></span>${l.status === 'skipped' ? html`<span class="tag skipped">skipped</span>` : ''}</button>`.s).join('') || '<p class="muted small">No players waiting. Approve players or reopen unsold ones.</p>';
    const L = { bid_accepted: 'Bid', bid_rejected: 'Rejected', player_selected: 'Introduced', bidding_opened: 'Bidding opened', bidding_reopened: 'Bidding reopened', bidding_closed: 'Bidding closed', last_call: 'Last call', player_sold: 'Sold', player_unsold: 'Unsold', player_skipped: 'Skipped', sale_undone: 'Sale undone', auction_started: 'Auction started', auction_paused: 'Paused', auction_resumed: 'Resumed', auction_ended: 'Auction ended', player_reopened: 'Returned to queue' };
    $('#feed').innerHTML = events.map(e => html`<div class="${e.type === 'bid_rejected' ? 'rej' : e.type === 'bid_accepted' ? 'ok' : ''}" title="${e.message || ''}"><span>${L[e.type] || e.type}${e.team_name ? ': ' + e.team_name : ''}${e.type === 'bid_rejected' && e.message ? ' (' + e.message + ')' : ''}${!e.team_name && e.full_name ? ': ' + e.full_name : ''}</span><span>${e.amount !== null ? html`<b>${fmt(e.amount)}</b> ` : ''}<small class="muted">${clock(e.created_at)}</small></span></div>`.s).join('') || '<p class="muted small">Bids appear here the moment they arrive.</p>';
  };
  const paint = (s) => {
    const se = s.session, ph = se.phase, c0 = s.current, lead = c0 && s.teams.find(t => t.id === c0.high_team_id);
    const ORDER = ['introduction', 'bidding', 'last_call', 'closed', 'sold'];
    const LBL = { introduction: 'Introduction', bidding: 'Bidding', last_call: 'Last call', closed: 'Closed', sold: 'Sold or unsold' };
    const idx = ORDER.indexOf(ph === 'unsold' ? 'sold' : ph);
    $('#now').innerHTML = html`${c0 ? html`<div class="block-now">${thumb(c0.photo_path, c0.full_name, 'av lg')}<div><h2>${c0.full_name}</h2><p class="muted small">${c0.code}, ${c0.primary_position}, base ${fmt(c0.base_price)}, increment ${fmt(c0.bid_increment)}</p><p>${lead ? html`Leading: <b>${lead.name}</b>` : 'No bids yet'} <span class="muted small" id="ccd"></span></p></div><div class="bid">${fmt(c0.high_bid ?? c0.base_price)}</div></div>` : html`<h2>${statusText(s)}</h2><p class="muted">${se.status === 'not_started' ? 'Start the auction, then select the first player.' : se.status === 'ended' ? 'The auction has ended. You can start it again if players remain.' : 'Select the next player from the queue or use the buttons below.'}</p>${s.last_result ? html`<p class="small" style="margin-top:.4rem">Last result: ${s.last_result.full_name}, ${s.last_result.status}${s.last_result.team_name ? ' to ' + s.last_result.team_name + ' for ' + fmt(s.last_result.price) : ''}</p>` : ''}`}
      <div class="phase-strip">${ORDER.map((o, i) => html`<span class="${i === idx ? 'on' : i < idx ? 'past' : ''}">${LBL[o]}</span>`)}</div>`.s;
    const live = se.status === 'live', active = ['introduction', 'bidding', 'last_call', 'closed'].includes(ph), bidding = ph === 'bidding';
    const B = (id, label, on, tone = '') => html`<button class="btn ${tone}" data-c="${id}" ${on ? '' : 'disabled'}>${label}</button>`;
    $('#ctl').innerHTML = html`${se.status === 'paused' ? B('resume', 'Resume', true, 'teal') : se.status === 'live' ? B('pause', 'Pause', true) : B('start', se.status === 'ended' ? 'Restart auction' : 'Start auction', true, 'teal')}
      ${B('next', 'Next player', live && !active, 'primary')}${B('random', 'Random player', live && !active)}
      ${B('open', ph === 'introduction' ? 'Open bidding' : 'Reopen bidding', live && ['introduction', 'closed', 'last_call'].includes(ph), 'teal')}${B('close', 'Close bidding', live && (bidding || ph === 'last_call'))}
      ${B('lastcall', 'Last call', live && (bidding || ph === 'closed') && !!c0?.bid_count, 'danger')}
      ${B('sold', 'Confirm SOLD', live && ['last_call', 'closed'].includes(ph) && !!c0?.high_team_id, 'good')}${B('unsold', 'Mark UNSOLD', live && active, 'danger')}${B('skip', 'Skip player', live && active)}
      ${B('lot', 'Change price or increment', !!c0 && active)}${B('end', 'End auction', se.status !== 'ended' && se.status !== 'not_started' && !active)}`.s;
    const canAb = live && ['bidding', 'last_call'].includes(ph) && c0;
    const sel = $('#abt')?.value;
    $('#ab').innerHTML = html`<select id="abt" style="flex:1 1 170px">${s.teams.filter(t => t.is_active).map(t => html`<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${t.name} (${fmt(t.remaining)} left)</option>`)}</select><button class="btn" id="abb" ${canAb ? '' : 'disabled'}>Bid ${c0 ? fmt(c0.next_bid) : ''}</button>`.s;
    $('#tp').innerHTML = s.teams.map(t => html`<div class="row between small" style="padding:.25rem 0;border-bottom:1px solid var(--line)"><span>${t.name} <span class="muted">${t.squad_count}/${t.squad_limit}</span></span><b class="num" style="font-size:1.15rem">${fmt(t.remaining)}</b></div>`.s).join('') || '<p class="muted small">No teams yet.</p>';
    paintSide();
  };
  $('#lq').oninput = paintSide;
  $('#ll').onclick = e => { const b = e.target.closest('[data-p]'); if (b && !b.disabled) run('admin_select_player', { p_ap: b.dataset.p }); };
  $('#ab').onclick = e => {
    if (e.target.id !== 'abb') return; const cur = Live.state.current; if (!cur) return;
    act(async () => { const r = await rpc('admin_place_bid', { p_auction_player_id: cur.auction_player_id, p_team: $('#abt').value, p_amount: cur.next_bid }); if (!r.ok) toast(r.message, true); await Live.refresh(); }, e.target);
  };
  $('#ctl').onclick = async e => {
    const id = e.target.dataset?.c; if (!id || e.target.disabled) return; const s = Live.state, cur = s.current, ap = cur?.auction_player_id;
    const lead = cur && s.teams.find(t => t.id === cur.high_team_id);
    switch (id) {
      case 'start': return run('admin_start_auction');
      case 'pause': return run('admin_pause_auction');
      case 'resume': return run('admin_resume_auction');
      case 'next': return run('admin_select_player', { p_mode: 'order' });
      case 'random': return run('admin_select_player', { p_mode: 'random' });
      case 'open': return run('admin_open_bidding');
      case 'close': return run('admin_close_bidding');
      case 'lastcall': return run('admin_last_call');
      case 'sold': if (await confirmDialog({ title: `Sell ${cur.full_name}?`, body: `${lead?.name} pays ${fmt(cur.high_bid)} ${unit()}.`, confirmLabel: 'Confirm SOLD', tone: 'good' })) run('admin_confirm_sold', { p_ap: ap }); return;
      case 'unsold': if (await confirmDialog({ title: `Mark ${cur.full_name} unsold?`, body: cur.bid_count ? 'The existing bids will be cancelled.' : 'You can reopen this player later.', confirmLabel: 'Mark UNSOLD', tone: 'danger' })) run('admin_mark_unsold', { p_ap: ap }); return;
      case 'skip': if (await confirmDialog({ title: `Skip ${cur.full_name}?`, body: cur.bid_count ? 'The existing bids will be cancelled. The player stays in the queue.' : 'The player stays in the queue.', confirmLabel: 'Skip player' })) run('admin_skip_player', { p_ap: ap }); return;
      case 'end': if (await confirmDialog({ title: 'End the auction?', body: 'Bidding stops for everyone. Players still waiting stay unassigned.', confirmLabel: 'End auction', tone: 'danger' })) run('admin_end_auction'); return;
      case 'lot': {
        const m = openModal(html`<h2>${cur.full_name}</h2><form class="stack" id="ltf"><div class="fgrid"><label class="f">Base price ${cur.bid_count ? html`<small>Locked after the first bid</small>` : ''}<input type="number" min="0" name="b" value="${cur.base_price}" ${cur.bid_count ? 'disabled' : ''}></label><label class="f">Bid increment<input type="number" min="1" name="i" value="${cur.bid_increment}"></label></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div></form>`.s);
        $('#ltf', m.el).onsubmit = ev => { ev.preventDefault(); const d = formData(ev.target); m.close(); run('admin_update_lot', { p_ap: ap, p_base: cur.bid_count ? null : Number(d.b), p_increment: Number(d.i) }); };
      }
    }
  };
  const iv = setInterval(() => { const s = Live.state, el = $('#ccd'); if (s && el) { const r = cdRemaining(s); el.textContent = r === null ? '' : ` ${Math.ceil(r)}s on the clock`; } }, 300);
  const un = Live.sub(s => { if (s.session.version !== lastV) { lastV = s.session.version; paint(s); loadSide(); } });
  return () => { un(); clearInterval(iv); };
};

adminViews.sold = async (c) => {
  const load = async () => {
    const rows = await rpc('admin_list', { p_kind: 'sales' });
    c.innerHTML = table([{ h: '', v: r => thumb(r.photo_path, r.full_name) }, { h: 'ID', v: r => r.code }, { h: 'Player', v: r => html`<b>${r.full_name}</b>` }, { h: 'Team', v: r => r.team_name }, { h: 'Price', r: 1, v: r => fmt(r.price) }, { h: 'Time', v: r => when(r.confirmed_at) }, { h: 'Status', v: r => r.undone_at ? html`<span class="tag withdrawn" title="${r.undo_reason}">undone: ${r.undo_reason}</span>` : statusTag('sold') }, { h: '', v: r => r.undone_at ? '' : html`<button class="btn sm" data-u="${r.id}" data-n="${r.full_name}">Undo sale</button>` }], rows, 'No sales yet.').s;
  };
  c.onclick = async e => {
    const id = e.target.dataset?.u; if (!id) return;
    const reason = await confirmDialog({ title: 'Undo the sale of ' + e.target.dataset.n, body: 'Points go back to the team and the player returns to the queue. The reason is kept in the audit log.', confirmLabel: 'Undo sale', tone: 'danger', input: { label: 'Reason' } });

  await act(load); return () => { c.onclick = null; };
};

adminViews.history = async (c) => {
  const [ev, au] = await Promise.all([rpc('admin_list', { p_kind: 'events', p_limit: 300 }), rpc('admin_list', { p_kind: 'audit', p_limit: 200 })]);
  c.innerHTML = html`<h3>Auction events</h3>${table([{ h: 'Time', v: e => when(e.created_at) }, { h: 'Event', v: e => e.type.replace(/_/g, ' ') }, { h: 'Player', v: e => e.full_name }, { h: 'Team', v: e => e.team_name }, { h: 'Points', r: 1, v: e => e.amount === null ? '' : fmt(e.amount) }, { h: 'Note', v: e => e.message }], ev, 'Nothing has happened yet.')}
    <h3>Admin audit log</h3>${table([{ h: 'Time', v: e => when(e.created_at) }, { h: 'Admin', v: e => e.actor_username }, { h: 'Action', v: e => e.action }, { h: 'Reason', v: e => e.reason }], au, 'No admin actions yet.')}`.s;
};

/* ---------- Announcements ---------- */
adminViews.announcements = async (c) => {
  let list = [];
  const load = async () => {
    list = await rpc('admin_list', { p_kind: 'announcements' });
    c.innerHTML = html`<form class="panel stack" id="af"><h3>Post an announcement</h3><label class="f">Title<input name="title" required maxlength="120"></label><label class="f">Details<textarea name="body" rows="2" maxlength="800"></textarea></label>
      <label class="check"><input type="checkbox" name="show_on_projector">Also show on the projector between players</label><div><button class="btn primary">Post announcement</button></div></form>
      ${table([{ h: 'Title', v: a => html`<b>${a.title}</b><br><span class="small muted">${a.body}</span>` }, { h: 'Projector', v: a => a.show_on_projector ? 'Yes' : 'No' }, { h: 'Posted', v: a => when(a.created_at) }, { h: '', v: a => html`<button class="btn sm ghost" data-d="${a.id}">Delete</button>` }], list, 'No announcements yet.')}`.s;
    $('#af').onsubmit = e => { e.preventDefault(); const d = formData(e.target); d.show_on_projector = !!d.show_on_projector; act(async () => { await rpc('admin_save_announcement', { p: d }); toast('Announcement posted.'); await load(); }, $('button.primary', e.target)); };
  };
  c.onclick = e => { const id = e.target.dataset?.d; if (id) act(async () => { await rpc('admin_delete_announcement', { p_id: id }); await load(); }); };
  await act(load); return () => { c.onclick = null; };
};

/* ---------- Reports ---------- */
adminViews.reports = async (c) => {
  await whenState();
  const R = [
    ['Players with phone numbers', 'Private. Includes contact details.', async () => toCsv(await rpc('admin_list', { p_kind: 'players' }), [['code', 'code'], ['name', 'full_name'], ['phone', 'phone'], ['position', 'primary_position'], ['secondary', 'secondary_position'], ['age', 'age'], ['category', 'category'], ['status', 'status'], ['auction_status', 'auction_status'], ['base_price', 'lot_base_price']]), 'players'],
    ['Sold players', 'Every sale, including undone ones and their reasons.', async () => toCsv(await rpc('admin_list', { p_kind: 'sales' }), [['code', 'code'], ['player', 'full_name'], ['team', 'team_name'], ['price', 'price'], ['confirmed_at', 'confirmed_at'], ['undone_at', 'undone_at'], ['undo_reason', 'undo_reason']]), 'sold'],
    ['Unsold players', 'Players marked unsold or skipped.', async () => toCsv((await rpc('admin_list', { p_kind: 'lots' })).filter(l => ['unsold', 'skipped'].includes(l.status)), [['code', 'code'], ['player', 'full_name'], ['position', 'primary_position'], ['base_price', 'base_price'], ['status', 'status']]), 'unsold'],
    ['Team squads', 'Final squads, one row per player.', async () => toCsv(await rpc('admin_list', { p_kind: 'squads' }), [['team', 'team_name'], ['code', 'code'], ['player', 'full_name'], ['position', 'primary_position'], ['category', 'category'], ['price', 'price']]), 'squads'],
    ['Team budgets', 'Budget, spend and squad size per team.', async () => toCsv(Live.state.teams, [['team', 'name'], ['starting_budget', 'starting_budget'], ['spent', 'spent'], ['remaining', 'remaining'], ['squad_count', 'squad_count'], ['squad_limit', 'squad_limit']]), 'budgets'],
    ['All bids', 'Every accepted bid, including cancelled ones.', async () => toCsv(await rpc('admin_list', { p_kind: 'bids', p_limit: 100000 }), [['time', 'created_at'], ['code', 'code'], ['player', 'full_name'], ['team', 'team_name'], ['amount', 'amount'], ['round', 'round'], ['source', 'source'], ['cancelled_at', 'voided_at']]), 'bids'],
    ['Admin audit log', 'Who changed what, and when.', async () => toCsv(await rpc('admin_list', { p_kind: 'audit', p_limit: 100000 }), [['time', 'created_at'], ['admin', 'actor_username'], ['action', 'action'], ['type', 'entity_type'], ['id', 'entity_id'], ['reason', 'reason']]), 'audit'],
  ];
  c.innerHTML = html`<div class="doors" style="margin:0">${R.map((r, i) => html`<div class="panel stack"><div><h3 style="margin-bottom:.2rem">${r[0]}</h3><p class="muted small">${r[1]}</p></div><div><button class="btn" data-i="${i}">Download CSV</button></div></div>`)}</div>`.s;
  c.onclick = e => { const i = e.target.dataset?.i; if (i !== undefined) act(async () => download(R[i][3] + '.csv', await R[i][2]()), e.target); };
  return () => { c.onclick = null; };
};

      <label class="f">Tournament name<input name="name" required value="${t.name}"></label><label class="f">Short name<input name="short_name" maxlength="12" value="${t.short_name || ''}"></label>
      <label class="f">Points label<input name="currency_label" maxlength="8" value="${st.currency_label}"></label></div>
      <div class="fgrid"><label class="f">Primary colour<input type="color" name="primary_color" value="${st.primary_color}"></label><label class="f">Accent colour<input type="color" name="accent_color" value="${st.accent_color}"></label><label class="f">Background colour<input type="color" name="background_color" value="${st.background_color}"></label></div></div>
    <div class="panel stack"><h3>Projector</h3><div class="fgrid">
      <label class="f">Animation intensity<select name="animation_intensity">${['high', 'medium', 'low'].map(x => html`<option ${x === st.animation_intensity ? 'selected' : ''}>${x}</option>`)}</select></label>
      <label class="f">Player introduction, seconds<input type="number" min="3" max="30" name="intro_duration_seconds" value="${st.intro_duration_seconds}"></label>
      <label class="f">Last call, seconds<input type="number" min="3" max="120" name="last_call_seconds" value="${st.last_call_seconds}"></label>
      <label class="f">SOLD display, seconds<input type="number" min="2" max="60" name="sold_display_seconds" value="${st.sold_display_seconds}"></label></div>
      <label class="check"><input type="checkbox" name="sound_enabled" ${st.sound_enabled ? 'checked' : ''}>Sound effects</label><label class="check"><input type="checkbox" name="show_stats" ${st.show_stats ? 'checked' : ''}>Statistics bar</label></div>
    <div class="panel stack"><h3>Registration and teams</h3><label class="check"><input type="checkbox" name="registration_open" ${st.registration_open ? 'checked' : ''}>Registration is open</label><div class="fgrid">
      <label class="f">Positions <small>Comma separated</small><input name="positions" value="${st.positions.join(', ')}"></label><label class="f">Player categories <small>Comma separated</small><input name="categories" value="${st.categories.join(', ')}"></label>
      <label class="f">Default team budget<input type="number" min="0" name="default_budget" value="${st.default_budget}"></label><label class="f">Default squad limit<input type="number" min="1" name="default_squad_limit" value="${st.default_squad_limit}"></label></div></div>
    <div><button class="btn primary" style="min-height:54px">Save settings</button></div></form>`.s;
  const get = photoPicker($('#lg'), { type: 'image/png', out: 512 });
  $('#sf').onsubmit = e => {
    e.preventDefault(); const d = formData(e.target);
    ['sound_enabled', 'show_stats', 'registration_open'].forEach(k => d[k] = !!d[k]);
    d.positions = d.positions.split(',').map(x => x.trim()).filter(Boolean); d.categories = d.categories.split(',').map(x => x.trim()).filter(Boolean);
    act(async () => { const b = get(); if (b) d.logo_path = await uploadImage(b, 'branding'); await rpc('admin_save_tournament', { p: d }); toast('Settings saved.'); await Live.refresh(); }, $('button.primary', e.target));
  };
};

/* ========== 14. Start-up ========== */
let sb = null;
function startApp() {
  if (/^YOUR_/.test(CONFIG.SUPABASE_URL) || /^YOUR_/.test(CONFIG.SUPABASE_KEY)) {
    $('#app').innerHTML = html`<div class="page"><div class="hero"><div class="state">Setup needed</div><h1>Connect your Supabase project</h1><p class="muted" style="margin-top:1rem">Open index.html, find the CONFIG block near the top of the script, and paste your Supabase project URL and publishable key. The README lists every step.</p></div></div>`.s;
    return;
  }
  if (!window.supabase) { $('#app').innerHTML = html`<div class="page"><div class="hero"><h1>Connection needed</h1><p class="muted" style="margin-top:1rem">The app could not load. Connect to the internet and reload this page.</p></div></div>`.s; return; }
  // Logins are the app's own, so each request carries the session token in a header the database reads.
  const withSession = (url, opts = {}) => {
    const headers = new Headers(opts.headers); const t = Session.get();
    if (t) headers.set('x-league-session', t);
    return fetch(url, { ...opts, headers });
  };
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }, global: { fetch: withSession } });
  addEventListener('hashchange', renderRoute);
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; });
  Live.start();
  renderRoute();
  if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('./sw.js').catch(() => { });
}
startApp();
</script>
